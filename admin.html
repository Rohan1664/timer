<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Timer Admin Panel</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body>

  <div class="container container-admin">
    <h1>Admin Panel</h1>

    <h2>Live Display</h2>
    <div id="time-display">00:00:00</div>
    <div id="status-display">Status: Stopped</div>

    <div class="controls-section">
      <h3>Controls</h3>
      <div class="buttons">
        <button onclick="sendCommand('start')">Start</button>
        <button onclick="sendCommand('pause')">Pause</button>
        <button onclick="sendCommand('reset')">Reset</button>
      </div>
    </div>

    <div class="custom-time-section">
      <h3>Set Custom Time</h3>
      <div class="time-inputs">
        <div class="input-group">
          <label>Hours</label>
          <input type="number" id="input-hrs" min="0" value="0">
        </div>
        <div class="input-group">
          <label>Minutes</label>
          <input type="number" id="input-mins" min="0" max="59" value="0">
        </div>
        <div class="input-group">
          <label>Seconds</label>
          <input type="number" id="input-secs" min="0" max="59" value="0">
        </div>
      </div>
      <button class="set-btn" onclick="setCustomTime()">Set Time</button>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
